appId: com.srbmaury.recalllater
name: A bill screenshot shared from Files is read on-device
---
# Starts in the Files app, opened on Downloads by run.sh.
- extendedWaitUntil:
    visible: Downloads
    timeout: 15000
# Newest files are listed first, so older fixtures can be below the fold.
- scrollUntilVisible:
    element: e2e-bill.jpg
- longPressOn: e2e-bill.jpg
- tapOn: Share
- tapOn: RecallLater
- extendedWaitUntil:
    visible: Electricity Bill
    timeout: 30000
- assertVisible: "2840"
- assertVisible: Billed on
# A suggested reminder (its time depends on when the suite runs relative to the due date).
- assertVisible: ✨.*
- assertVisible: Until done
- tapOn: Save
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
- assertVisible: Electricity Bill
