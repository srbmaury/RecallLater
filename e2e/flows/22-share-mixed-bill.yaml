appId: com.srbmaury.recalllater
name: A mixed Hindi–English bill with Devanagari digits
---
- extendedWaitUntil:
    visible: Downloads
    timeout: 15000
# Newest files are listed first, so older fixtures can be below the fold.
- scrollUntilVisible:
    element: e2e-mixed-bill.png
- longPressOn: e2e-mixed-bill.png
- tapOn: Share
- tapOn: RecallLater
- extendedWaitUntil:
    visible: Oct 5
    timeout: 30000
# ₹४९९: Devanagari digits, and a rupee sign the Devanagari model misreads.
- assertVisible: "499"
- assertVisible: Mobile Bill
- tapOn: Save
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
