appId: com.srbmaury.recalllater
name: A coloured bill with a header grid and charges table is read correctly
---
- extendedWaitUntil:
    visible: Downloads
    timeout: 15000
# Newest files are listed first, so older fixtures can be below the fold.
- scrollUntilVisible:
    element: e2e-color-bill.png
- longPressOn: e2e-color-bill.png
- tapOn: Share
- tapOn: RecallLater
- extendedWaitUntil:
    visible: Electricity Bill
    timeout: 30000
# The total, not the largest line item or the energy charges.
- assertVisible: "2840"
- assertVisible: Billed on
# The fixture's due date is fixed, so whether a reminder is suggested depends on the day the
# suite runs; suggestions are covered by unit tests with a pinned date.
- tapOn: "Save & remind|Save only"
# The same bill as flow 04 (same amount and due date): duplicate detection asks first.
- extendedWaitUntil:
    visible: Already saved
    timeout: 10000
- tapOn: SAVE AS NEW
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
