appId: com.srbmaury.recalllater
name: A shop link becomes a Buy Later item without a reminder
---
- extendedWaitUntil:
    visible: Sony WH 1000XM6 Wireless Headphones
    timeout: 30000
- assertVisible: .*amazon\.in.*
- assertVisible: Save only
- tapOn: "Save & remind|Save only"
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
- assertVisible: Sony WH 1000XM6 Wireless Headphones
