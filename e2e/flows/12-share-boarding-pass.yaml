appId: com.srbmaury.recalllater
name: A coloured boarding pass with labels above values is read correctly
---
- extendedWaitUntil:
    visible: Downloads
    timeout: 15000
# Newest files are listed first, so older fixtures can be below the fold.
- scrollUntilVisible:
    element: e2e-boarding-pass.png
- longPressOn: e2e-boarding-pass.png
- tapOn: Share
- tapOn: RecallLater
- extendedWaitUntil:
    visible: DEL → BLR
    timeout: 30000
- assertVisible: 6E 6132
- assertVisible: X7K2QP
# Departure time from its own column, not the boarding time.
- assertVisible: .*6:20.*
- tapOn: "Save & remind|Save only"
# No duplicate prompt: the PDF ticket with the same PNR was marked done in flow 09.
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
