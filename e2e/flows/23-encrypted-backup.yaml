appId: com.srbmaury.recalllater
name: A passphrase-protected backup restores only with the right passphrase
---
- repeat:
    while:
      notVisible: Collections
    times: 3
    commands:
      - back
- tapOn: Settings
- scrollUntilVisible:
    element: Back up to a file…
- tapOn: Back up to a file…
- tapOn: Passphrase
- inputText: recall later 2026
- tapOn: Passphrase again
- inputText: recall later 2026
- tapOn: Encrypt and save
- extendedWaitUntil:
    visible: .*(Share|Save your backup).*
    timeout: 20000
- back
