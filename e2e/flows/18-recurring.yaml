appId: com.srbmaury.recalllater
name: Rent repeats monthly and comes back after it's paid
---
- extendedWaitUntil:
    visible: More options
    timeout: 30000
- tapOn: More options
- scrollUntilVisible:
    element: Every month
- assertVisible:
    text: Every month
    selected: true
- tapOn: "Save & remind|Save only"
- extendedWaitUntil:
    visible: Everything you've shared, newest first
    timeout: 10000
- tapOn:
    text: .*↻ every month.*
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: Mark paid
- tapOn: Mark paid
- extendedWaitUntil:
    visible: Next one added
    timeout: 10000
- assertVisible: .*is back for .*
- tapOn: OK
