name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      # Includes the parser accuracy reports, which fail if accuracy drops below its floor.
      - name: Unit tests
        run: npx jest --ci
      - name: Expo doctor
        run: npx expo-doctor
