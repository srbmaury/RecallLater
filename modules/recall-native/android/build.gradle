plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.srbmaury.recalllater.recallnative'
version = '0.1.0'

android {
  namespace "com.srbmaury.recalllater.recallnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled (not Play Services) models so OCR works offline and without a model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
}
